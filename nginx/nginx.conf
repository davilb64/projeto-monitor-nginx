events {
    worker_connections 1024;
}

http {
    # Site 1: Frontend (Porta 80)
    server {
        listen 80;
        root /usr/share/nginx/html/frontend;
        index index.html;
    }

    # Site 2: API (Porta 8081)
    server {
        listen 8081;
        default_type application/json;
        root /usr/share/nginx/html/api;
    }

    # Site 3: Admin (Porta 8082)
    server {
        listen 8082;
        root /usr/share/nginx/html/admin;
        index index.html;
    }
}