<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Monitor NGINX Pro</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        .log-entry { border-bottom: 1px solid #333; padding: 10px 0; }
        .status-200 { color: #4CAF50; font-weight: bold; }
        .status-404 { color: #F44336; font-weight: bold; }
        .ip { color: #569CD6; }
        .rota { color: #CE9178; }
        #logs { background: #000; padding: 15px; border-radius: 5px; height: 500px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>Monitor de Tráfego em Tempo Real</h2>
    <div id="logs"></div>

    <script>
        const eventSource = new EventSource("/stream");
        const areaLogs = document.getElementById("logs");

        eventSource.onmessage = function(event) {
            let dados;
            try {
                // Converte a string JSON recebida do Go em um objeto JavaScript
                dados = JSON.parse(event.data);
            } catch (erro) {
                console.error("Falha ao processar evento SSE:", erro, event.data);
                return;
            }
            
            // Define a cor baseada no status
            const corStatus = dados.Status.startsWith("2") ? "status-200" : "status-404";

            // Cria o layout da linha
            const html = `
                <div class="log-entry">
                    [${dados.DataHora}] <span class="ip">${dados.IP}</span> 
                    solicitou <span class="rota">${dados.Metodo} ${dados.Rota}</span> 
                    -> <span class="${corStatus}">${dados.Status}</span> 
                    (${dados.TamanhoBytes} bytes) | <i>${dados.UserAgent}</i>
                </div>
            `;

            areaLogs.innerHTML += html;
            areaLogs.scrollTop = areaLogs.scrollHeight; 
        };

        eventSource.onerror = function(error) {
            console.error("Erro na conexão com o stream:", error);
        };
    </script>
</body>
</html>
